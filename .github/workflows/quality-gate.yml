name: Quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check OmniBox inline JavaScript
        run: npm run check:inline-js

      - name: Test
        run: npm test

      - name: Test provider bridge
        run: npm run test:bridge

      - name: Build
        run: npm run build
