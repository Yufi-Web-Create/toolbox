name: X Chat SDK isolated integration check

on:
  push:
    branches:
      - feature/xchat-official-sdk
    paths:
      - package.json
      - .github/workflows/xchat-sdk-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock official Chat XDK and Juicebox SDK dependencies"
            git push origin HEAD:feature/xchat-official-sdk
          fi
      - name: Install reproducibly
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
