name: IMAP SMTP dependency validation

on:
  push:
    branches:
      - feature/generic-imap-smtp
    paths:
      - package.json
      - .github/workflows/imap-smtp-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --save-exact
      - name: Commit pinned dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock IMAP SMTP Node dependencies"
            git push origin HEAD:feature/generic-imap-smtp
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:inline-js
      - run: npm test
      - run: npm run build
